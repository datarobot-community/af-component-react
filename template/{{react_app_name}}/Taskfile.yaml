---
version: '3'
tasks:
  install:
    desc: 🧱 Install React dependencies
    cmds:
      - npm install
  lint:
    desc: 🧹 Lint React code
    cmds:
      - npm run lint -- --fix
      - npm run prettier --write
  lint-check:
    desc: 🧹 Lint React code
    cmds:
      - npm run lint
      - npm run prettier
  test:
    desc: 🧪 Test React code
    cmds:
      - npm run test:coverage
  build:
    desc: 🏗️ Build React code
    cmds:
      - npm run build
  dev:
    desc: 🚀 Start React development server
    cmds:
      - npm run dev